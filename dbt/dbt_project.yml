name: 'weather_analytics'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'weather_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  weather_analytics:
    +materialized: view
    transform:
      +materialized: ephemeral
    analytics:
      +materialized: table
