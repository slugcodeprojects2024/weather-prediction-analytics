<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>

  <!-- Open-Meteo API -->
  <rect x="40" y="30" width="260" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="170" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Open-Meteo Forecast API</text>
  <text x="170" y="74" text-anchor="middle" font-size="11" fill="#4338ca">api.open-meteo.com/v1/forecast</text>

  <!-- Airflow Variable / Connection -->
  <rect x="340" y="30" width="300" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="490" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Airflow config (Admin UI)</text>
  <text x="490" y="67" text-anchor="middle" font-size="11" fill="#475569">Variable: weather_locations (JSON)</text>
  <text x="490" y="82" text-anchor="middle" font-size="11" fill="#475569">Connection: snowflake_conn</text>

  <!-- arrow Open-Meteo -> DAG1 -->
  <line x1="170" y1="90" x2="170" y2="140" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="178" y="118" font-size="11" fill="#333333">GET forecast, 2 cities</text>

  <!-- DAG 1 box -->
  <rect x="30" y="145" width="430" height="190" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="245" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Airflow DAG 1: weather_etl_to_snowflake</text>
  <text x="245" y="183" text-anchor="middle" font-size="10.5" fill="#065f46">schedule: @daily</text>

  <rect x="50" y="195" width="180" height="34" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="140" y="216" text-anchor="middle" font-size="11.5" fill="#065f46">get_locations / extract_forecast</text>

  <rect x="250" y="195" width="190" height="34" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="345" y="216" text-anchor="middle" font-size="11.5" fill="#065f46">create_table (IF NOT EXISTS)</text>

  <line x1="230" y1="212" x2="250" y2="212" stroke="#10b981" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="50" y="243" width="390" height="40" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="245" y="260" text-anchor="middle" font-size="11.5" font-weight="600" fill="#065f46">load_weather_forecast</text>
  <text x="245" y="275" text-anchor="middle" font-size="10.5" fill="#047857">BEGIN &#8594; DELETE+INSERT &#8594; COMMIT, rollback on exception</text>

  <line x1="245" y1="229" x2="245" y2="243" stroke="#10b981" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="140" y1="229" x2="140" y2="243" stroke="#10b981" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="140" y="297" width="210" height="30" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="245" y="317" text-anchor="middle" font-size="11.5" fill="#065f46">verify_load (row-count check)</text>
  <line x1="245" y1="283" x2="245" y2="297" stroke="#10b981" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- DAG1 -> RAW table -->
  <line x1="460" y1="260" x2="620" y2="260" stroke="#047857" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="250" font-size="11" fill="#047857">INSERT (transaction)</text>

  <!-- RAW table -->
  <rect x="620" y="220" width="250" height="80" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="745" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Snowflake</text>
  <text x="745" y="263" text-anchor="middle" font-size="12" fill="#7c2d12">RAW.WEATHER_FORECAST</text>
  <text x="745" y="280" text-anchor="middle" font-size="10.5" fill="#9a3412">PK (city, forecast_date)</text>

  <!-- DAG1 -> DAG2 trigger -->
  <line x1="245" y1="335" x2="245" y2="390" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="366" font-size="11" fill="#333333">TriggerDagRunOperator</text>
  <text x="255" y="380" font-size="11" fill="#333333">(after verify_load succeeds)</text>

  <!-- DAG 2 box -->
  <rect x="30" y="395" width="430" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="245" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Airflow DAG 2: weather_dbt_transform</text>
  <text x="245" y="433" text-anchor="middle" font-size="10.5" fill="#1e3a8a">schedule: None (external trigger only)</text>

  <rect x="50" y="448" width="110" height="34" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="105" y="469" text-anchor="middle" font-size="11.5" fill="#1e3a8a">dbt run</text>
  <rect x="180" y="448" width="110" height="34" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="235" y="469" text-anchor="middle" font-size="11.5" fill="#1e3a8a">dbt test</text>
  <rect x="310" y="448" width="130" height="34" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="375" y="469" text-anchor="middle" font-size="11.5" fill="#1e3a8a">dbt snapshot</text>

  <line x1="160" y1="465" x2="180" y2="465" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="290" y1="465" x2="310" y2="465" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- RAW -> DAG2 (read) -->
  <line x1="745" y1="300" x2="745" y2="340" stroke="#9a3412" stroke-width="1.3"/>
  <line x1="745" y1="340" x2="460" y2="430" stroke="#9a3412" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="560" y="350" font-size="11" fill="#9a3412">SELECT source('raw','weather_forecast')</text>

  <!-- DAG2 -> ANALYTICS -->
  <line x1="460" y1="450" x2="620" y2="450" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="440" font-size="11" fill="#1d4ed8">CREATE TABLE AS</text>

  <!-- ANALYTICS schema -->
  <rect x="620" y="395" width="260" height="130" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="750" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">ANALYTICS schema</text>
  <text x="635" y="438" font-size="10.5" fill="#4c1d95">&#8226; weather_moving_avg</text>
  <text x="635" y="454" font-size="10.5" fill="#4c1d95">&#8226; weather_temp_anomaly</text>
  <text x="635" y="470" font-size="10.5" fill="#4c1d95">&#8226; weather_rolling_rainfall</text>
  <text x="635" y="486" font-size="10.5" fill="#4c1d95">&#8226; weather_dry_spell</text>
  <text x="635" y="507" font-size="10.5" fill="#6d28d9" font-style="italic">(stg_weather_forecast, ephemeral CTE)</text>

  <!-- DAG2 -> SNAPSHOTS -->
  <line x1="375" y1="482" x2="375" y2="560" stroke="#1d4ed8" stroke-width="1.3"/>
  <line x1="375" y1="560" x2="620" y2="560" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="400" y="550" font-size="11" fill="#1d4ed8">check-strategy snapshot</text>

  <rect x="620" y="535" width="260" height="55" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="750" y="557" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">SNAPSHOTS schema</text>
  <text x="750" y="575" text-anchor="middle" font-size="10.5" fill="#86198f">snapshot_weather_forecast</text>

  <!-- ANALYTICS -> Tableau -->
  <line x1="750" y1="525" x2="750" y2="600" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="760" y="612" font-size="11" fill="#6d28d9">Snowflake connector</text>

  <!-- Tableau -->
  <rect x="620" y="625" width="260" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="750" y="652" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Tableau Dashboard</text>
  <text x="750" y="670" text-anchor="middle" font-size="10.5" fill="#991b1b">Moving avg, anomaly, rainfall,</text>
  <text x="750" y="684" text-anchor="middle" font-size="10.5" fill="#991b1b">dry-spell charts, city/date filters</text>

  <!-- Legend -->
  <text x="40" y="735" font-size="10.5" fill="#555555">Solid arrows: data / control flow.  Dashed box: configuration read at DAG start (not data).</text>
</svg>
